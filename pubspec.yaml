# NOTE: the package name is intentionally kept as `flutter_star_prnt_plus` so
# apps (TelmeGo) can switch from the old fork by only changing the git URL.
name: flutter_star_prnt_plus
description: Flutter plugin for Star Micronics printers built on Star's maintained StarXpand SDK (StarIO10). Drop-in replacement for flutter_star_prnt_plus.
version: 3.0.0
publish_to: none
homepage: https://github.com/niconab/flutter_star_xpand

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  collection: ^1.15.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.eddayy.flutter_star_prnt
        pluginClass: FlutterStarPrntPlugin
      ios:
        pluginClass: FlutterStarPrntPlugin
